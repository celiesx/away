<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Away Message</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;700;800&family=Share+Tech+Mono&family=VT323&display=swap">
<style>
/* Layout: an AIM-style desktop. Buddy list | chat | profile windows on a patterned wall, tabs on phones.
   Every color comes from three tokens (--bg, --fg, --ac) that a profile sets, so each window looks like its owner. */
:root{
  --bg:#0b0b0c;--fg:#ecebe3;--ac:#ffd400;--on-ac:#000;
  --font:"Share Tech Mono","Courier New",monospace;--fs:14px;
  --rad:0;--rs:0;--bw:2px;--bs:solid;--sh:5px 5px 0 var(--line);--tb:var(--ac);--tbsize:100% 100%;--glow:none;
  --ok:#3ecf5b;--warn:#f5a623;
  color-scheme:dark;
}
.theme{
  --panel:color-mix(in srgb,var(--fg) 7%,var(--bg));
  --panel2:color-mix(in srgb,var(--fg) 13%,var(--bg));
  --line:color-mix(in srgb,var(--fg) 28%,var(--bg));
  --muted:color-mix(in srgb,var(--fg) 64%,var(--bg));
  --ac-soft:color-mix(in srgb,var(--ac) 24%,var(--bg));
  --wall:color-mix(in srgb,var(--ac) 9%,var(--bg));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--wall);color:var(--fg);font:var(--fs)/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[data-pat="stars"]{background-image:radial-gradient(color-mix(in srgb,var(--fg) 38%,transparent) 1px,transparent 1.8px),radial-gradient(color-mix(in srgb,var(--ac) 45%,transparent) 1px,transparent 1.8px);background-size:23px 23px,37px 37px;background-position:0 0,11px 17px}
[data-pat="checks"]{background-image:conic-gradient(color-mix(in srgb,var(--fg) 9%,transparent) 25%,transparent 0 50%,color-mix(in srgb,var(--fg) 9%,transparent) 0 75%,transparent 0);background-size:30px 30px}
[data-pat="scan"]{background-image:repeating-linear-gradient(0deg,color-mix(in srgb,var(--fg) 8%,transparent) 0 1px,transparent 1px 3px)}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* controls */
input,select,textarea,button{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);padding:6px 9px;border-radius:var(--rs)}
input,textarea,select{width:100%;min-width:0}
textarea{resize:vertical}
input[type=color]{padding:2px;height:34px}
input[type=file]{padding:4px}
input[type=checkbox]{width:auto}
.btn{cursor:pointer;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.btn.sm{padding:3px 8px;font-size:12px}
:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 3px}
label.tick{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--fg);cursor:pointer}

/* windows */
.win{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);color:var(--fg);
  border:var(--bw) var(--bs) var(--ac);border-radius:var(--rad);box-shadow:var(--sh);text-shadow:var(--glow);overflow:hidden}
.tb{display:flex;align-items:center;gap:8px;padding:5px 9px;background:var(--tb);background-size:var(--tbsize);color:var(--on-ac);
  font-weight:800;letter-spacing:.05em;text-transform:lowercase;user-select:none;animation:shimmer 7s linear infinite;text-shadow:none}
@keyframes shimmer{to{background-position:300% 0}}
.dots{margin-left:auto;display:flex;gap:4px}
.dots i{display:block;width:11px;height:11px;border:2px solid currentColor}
.tbx{margin-left:auto;padding:0 8px;line-height:1.2;background:transparent;color:inherit;border:2px solid currentColor;font-weight:800;cursor:pointer}
.scroll{flex:1;min-height:0;overflow:auto}
.note{padding:6px 10px;font-size:12px;background:var(--ac-soft);border-bottom:1px solid var(--line)}
.warn{color:var(--warn);font-size:12px;margin:6px 0 0}

/* sign on */
#signon{flex:1;display:grid;place-items:center;min-height:0}
#signon .win{width:min(380px,100%)}
.so-body{padding:18px;display:flex;flex-direction:column;gap:4px}
.logo{margin:0 0 6px;font-size:clamp(34px,9vw,52px);line-height:.95;letter-spacing:-.03em;font-weight:800}
.logo span{display:inline-block;background:var(--ac);color:var(--on-ac);padding:0 8px;margin-top:4px}
#soBtn{margin-top:12px;padding:9px}

/* desk */
#desk{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);gap:14px}
#buddyWin{grid-column:1;grid-row:1}
#chatWin,#editWin{grid-column:2;grid-row:1}
#profWin{grid-column:3;grid-row:1}
#editWin{display:none}
#tabs{display:none;gap:6px}
#tabs button{flex:1;cursor:pointer;font-weight:700;padding:9px 6px;background:var(--panel2)}
#tabs button[aria-current=true]{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;background:var(--fg);color:var(--bg);font-size:11px;text-align:center}

/* buddy list */
.mebox{display:flex;flex-direction:column;gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.me-row{display:flex;gap:10px;align-items:center}
.me-row .sn{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ac)}
.grp{margin:0;padding:3px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--panel2);position:sticky;top:0;z-index:1}
.buddy{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;text-align:left;cursor:pointer;padding:6px 10px}
.buddy:hover,.buddy[aria-current=true]{background:var(--ac-soft)}
.buddy .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.buddy .sub{font-size:12px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.on{background:var(--ok)}
.dot.away{background:transparent;border:2px solid var(--warn)}
.empty{margin:0;padding:14px;color:var(--muted)}
#spRow{display:flex;flex-direction:column;gap:4px}
#spStat{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.foot{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.av{--s:28px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;background:var(--c,var(--ac));color:var(--oc,var(--on-ac));
  font-weight:800;font-size:calc(var(--s)*.5);border:1px solid var(--line);object-fit:cover;border-radius:var(--rs);text-shadow:none}

/* chat */
.log{flex:1;min-height:0;overflow:auto;padding:4px 12px 12px;display:flex;flex-direction:column}
.m{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:10px;margin-top:11px}
.m.cont{margin-top:1px}
.m .av{--s:32px}
.m .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chip{border:0;padding:0 7px;background:var(--c);color:var(--oc);font-weight:800;cursor:pointer;border-radius:var(--rs);text-shadow:none}
.m time{font-size:11px;color:var(--muted)}
.tx{overflow-wrap:anywhere}
.tx a{color:var(--ac)}
.at{color:var(--ac);font-weight:700}
.act{margin-top:9px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.sys{align-self:center;margin-top:10px;font-size:12px;color:var(--muted)}
.auto{margin:3px 0 0 42px;font-size:12px;color:var(--muted);border-left:3px solid var(--c);padding-left:8px}
.card{display:flex;align-items:center;gap:10px;margin-top:5px;padding:7px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)!important;text-decoration:none;max-width:min(100%,380px);border-radius:var(--rs)}
.card:hover{border-color:var(--ac)}
.glyph{width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--ac);color:var(--on-ac);font-weight:800}
.ctext{display:flex;flex-direction:column;min-width:0}
.ctext small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.compose{display:flex;gap:8px;padding:8px;border-top:2px solid var(--line)}

/* profile */
.pbody{flex:1;min-height:0;overflow:auto;padding:14px;background-color:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs)}
.phead{display:flex;gap:12px;align-items:center}
.phead .av{--s:84px}
.psn{margin:0;font-size:24px;line-height:1.1;color:var(--ac);overflow-wrap:anywhere}
.pst{display:flex;gap:7px;align-items:center;margin-top:5px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.sec{margin-top:16px}
.sec h3{margin:0 0 7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:3px}
.sec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.song{display:flex;gap:9px;align-items:center;border:1px solid var(--line);padding:6px 9px;background:var(--panel)}
.song a{color:var(--ac)}
.mq{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.mq span{display:inline-block;animation:mq 12s linear infinite;padding-left:100%}
@keyframes mq{to{transform:translateX(-100%)}}
.t8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.t8 button{border:0;background:none;padding:0;cursor:pointer;text-align:center;font-size:12px;position:relative}
.t8 .av{width:100%;height:auto;aspect-ratio:1;font-size:26px;display:grid}
.t8 span.nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.t8 b{position:absolute;left:0;top:0;background:var(--ac);color:var(--on-ac);font-size:11px;padding:0 4px}
.links a{display:block;color:var(--ac);padding:2px 0;overflow-wrap:anywhere}
.joined{margin-top:16px;font-size:12px;color:var(--muted)}

/* editor */
.eform{padding:6px 14px 0}
.eform fieldset{border:1px solid var(--line);margin:12px 0;padding:2px 12px 12px;min-width:0}
.eform legend{padding:0 6px;font-weight:800;color:var(--ac)}
.avrow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.avrow input[type=file]{flex:1;min-width:150px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:6px;margin-top:6px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.pre{cursor:pointer;font-weight:800;padding:9px 8px;background:var(--pb);color:var(--pf);border:3px solid var(--pa);text-align:left}
.pre[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tick .rank{color:var(--ac)}
.actions{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0;background:var(--panel);border-top:1px solid var(--line)}
body.editing #editWin{display:flex}
body.editing #chatWin{display:none}

@media (max-width:900px){
  #tabs{display:flex}
  #desk{grid-template-columns:minmax(0,1fr)}
  #buddyWin,#chatWin,#editWin,#profWin{grid-column:1;grid-row:1;display:none}
  body[data-tab="buddies"] #buddyWin,body[data-tab="chat"] #chatWin,body[data-tab="profile"] #profWin{display:flex}
  body.editing #chatWin{display:none}
  body.editing[data-tab="chat"] #editWin{display:flex}
  .win{box-shadow:none}
}
@media (max-width:420px){.t8{grid-template-columns:repeat(3,minmax(0,1fr))}.colors{grid-template-columns:1fr}.presets{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tb,.mq span{animation:none}.mq span{padding-left:0}}
</style>

<div id="app">

      </div>

  <div id="desk" hidden>

          <label for="eSn">Screen name</label><input id="eSn" maxlength="20" spellcheck="false">
          <label for="eBio">About me</label><textarea id="eBio" rows="4" maxlength="400"></textarea>
          <div class="avrow"><span id="eAvPrev"></span><input id="eAv" type="file" accept="image/*" aria-label="Profile photo"><button id="eAvRm" class="btn sm" type="button">Remove photo</button></div>

          <label for="eSongT">Song</label><input id="eSongT" maxlength="60" placeholder="Artist - Title">
          <label for="eSongU">Link</label><input id="eSongU" maxlength="300" inputmode="url" placeholder="YouTube, Spotify, SoundCloud...">
        </fieldset>
        <fieldset><legend>Links</legend>
          <div class="lrow"><input id="eL0n" maxlength="24" placeholder="Label" aria-label="Link 1 label"><input id="eL0u" maxlength="300" inputmode="url" placeholder="https://" aria-label="Link 1 address"></div>
          <div class="lrow"><input id="eL1n" maxlength="24" placeholder="Label" aria-label="Link 2 label"><input id="eL1u" maxlength="300" inputmode="url" placeholder="https://" aria-label="Link 2 address"></div>
          <div class="lrow"><input id="eL2n" maxlength="24" placeholder="Label" aria-label="Link 3 label"><input id="eL2u" maxlength="300" inputmode="url" placeholder="https://" aria-label="Link 3 address"></div>
        </fieldset>
        <fieldset><legend>Top friends</legend>
          <p class="muted" style="margin:8px 0">Tick up to 8. The order you tick them is the order they show.</p>
          <div id="eTop"></div>
        </fieldset>
        <fieldset><legend>Look</legend>
          <div id="ePre" class="presets"></div>

            <div><label for="eAc">Accent</label><input id="eAc" type="color"></div>
            <div><label for="eBg">Background</label><input id="eBg" type="color"></div>
            <div><label for="eFg">Text</label><input id="eFg" type="color"></div>
          </div>
          <label for="eFont">Font</label><select id="eFont"></select>
          <label for="ePat">Wallpaper</label><select id="ePat"></select>
          <p id="eHint" class="warn" hidden></p>
        </fieldset>
        <p id="eErr" class="warn" role="alert" hidden></p>
        <div class="actions"><button id="eSave" class="btn pri" type="submit">Save</button><button id="eCancel" class="btn" type="button">Cancel</button></div>
      </form>
    </section>

    <section id="profWin" class="win theme" aria-label="Profile">
      <div class="tb"><span id="profTitle">profile</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <div id="profBody" class="pbody"></div>
    </section>
  </div>

  <nav id="tabs" aria-label="Sections" hidden>
    <button type="button" data-go="buddies">Buddies</button>
    <button type="button" data-go="chat">Chat<span id="unread" class="badge" hidden></span></button>
    <button type="button" data-go="profile">Profile</button>
  </nav>
</div>

/* ---------- writes ---------- */

}

}

  const m = { uid: key(), text, kind, ts: Date.now() };

    const i = d.top.indexOf(id);
    box.append(h('label', { class: 'tick', for: 'top_' + id },
      h('input', { type: 'checkbox', id: 'top_' + id, 'data-uid': id, checked: i >= 0 ? true : null, disabled: (i < 0 && d.top.length >= 8) ? true : null }),
      h('span', {}, p.sn), i >= 0 ? h('b', { class: 'rank' }, '#' + (i + 1)) : null));
  }
}
function fillEditor() {
  const d = S.draft;
  $('eSn').value = d.sn; $('eBio').value = d.bio; $('eSongT').value = d.song.title; $('eSongU').value = d.song.url;
  for (let i = 0; i < 3; i++) { const l = d.links[i] || { label: '', url: '' }; $('eL' + i + 'n').value = l.label; $('eL' + i + 'u').value = l.url; }
  syncLook(); fillTop(); $('eAvPrev').replaceChildren(avatar(d, 44)); $('eErr').hidden = true;
}
function syncLook() {
  const t = S.draft.theme;
  $('eAc').value = t.ac; $('eBg').value = t.bg; $('eFg').value = t.fg; $('eFont').value = t.font; $('ePat').value = t.pat;
  document.querySelectorAll('#ePre [data-preset]').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === t.preset ? 'true' : 'false'));
  const hint = $('eHint'), msgs = [];
  if (ratio(t.ac, t.bg) < 3) msgs.push('Your accent is hard to read on that background.');
  if (ratio(t.fg, t.bg) < 4.5) msgs.push('Your text color is hard to read on that background.');
  hint.hidden = !msgs.length; hint.textContent = msgs.join(' ');
}
function readEditor() {
  const d = S.draft;
  d.sn = $('eSn').value; d.bio = $('eBio').value; d.song = { title: $('eSongT').value, url: $('eSongU').value, auto: !!d.song.auto };
  d.links = [0, 1, 2].map(i => ({ label: $('eL' + i + 'n').value, url: $('eL' + i + 'u').value }));
  Object.assign(d.theme, { ac: $('eAc').value, bg: $('eBg').value, fg: $('eFg').value, font: $('eFont').value, pat: $('ePat').value });
}
function livePreview() { readEditor(); syncLook(); applyViewer(S.draft.theme); renderProfile(); }
function openEditor() {
  const p = mine(); if (!p || S.readOnly) return;
  S.draft = JSON.parse(JSON.stringify(p)); S.editing = true; S.selected = key();
  document.body.classList.add('editing'); fillEditor(); renderAll(); setTab('chat');
}
function closeEditor() {
  S.editing = false; S.draft = null; document.body.classList.remove('editing');
  S.theme = (mine() || { theme: S.theme }).theme; renderAll();
}
async function saveEditor(ev) {
  ev.preventDefault(); readEditor();
  const d = S.draft, err = $('eErr'), fail = m => { err.textContent = m; err.hidden = false; };
  if (!SN_OK.test(d.sn.trim())) return fail('Screen name needs 2 to 20 letters, numbers, dots, dashes or underscores.');
  if ([...S.profiles].some(([id, q]) => id !== key() && q.sn.toLowerCase() === d.sn.trim().toLowerCase())) return fail('Somebody already has that screen name.');
  let song = { title: d.song.title.trim(), url: '', auto: !!d.song.auto };
  if (d.song.url.trim()) { const u = safeUrl(d.song.url); if (!u) return fail('The song link needs to start with http:// or https://'); song.url = u; }
  const links = [];
  for (const l of d.links) {
    if (!l.url.trim() && !l.label.trim()) continue;
    const u = safeUrl(l.url); if (!u) return fail('Each link needs a web address that starts with http:// or https://');
    links.push({ label: l.label.trim(), url: u });
  }
  const next = cleanProfile(Object.assign({}, d, { sn: d.sn.trim(), song, links }));
  $('eSave').disabled = true;
  const ok = await persist(next);
  $('eSave').disabled = false;
  if (!ok && !S.readOnly) return fail('Could not save. Try again in a moment.');
  closeEditor();
}
function pickAvatar(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 96;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 96, 96);
      S.draft.avatar = okAvatar(c.toDataURL('image/jpeg', .78));
      $('eAvPrev').replaceChildren(avatar(S.draft, 44)); renderProfile();
    };
    img.onerror = () => { const e = $('eErr'); e.textContent = 'That file could not be read as a picture.'; e.hidden = false; };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- live data ---------- */
function loadLocal() {
  try { const r = LS.get('am.local'); if (r) S.profiles.set('me', cleanProfile(JSON.parse(r))); } catch {}
}
async function init() {
  use('mcp').then(m => { mcp = m; S.mcpOk = !!m; renderSp(); if (m && S.signedOn && LS.get('am.spotify') === 'on' && !S.spOn) spStart(false); });
  const [user, db] = await Promise.all([use('user'), use('db')]);
  S.user = user;
  if (user) { try { const m = await user.me(); S.id = m.id || null; const c = m.color && toHex(m.color); if (c) S.color = c; } catch {} }
  if (!db) { S.mode = 'local'; loadLocal(); renderAll(); return; }
  S.db = db; S.mode = 'db';
  if (!S.id) S.readOnly = true;
  else { try { if ((await user.can('data.write')) === false) S.readOnly = true; } catch {} }
  const timer = setTimeout(() => { S.slow = true; renderSignon(); renderNote(); }, 10000);
  db.collection('profiles').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; S.gotSnap = true; }
    const m = new Map(); snap.docs.forEach(d => m.set(d.id, cleanProfile(d.data())));
    S.profiles = m;
    if (mine() && !S.editing) S.theme = mine().theme;
    if (S.readOnly && !S.id) S.gotSnap = true;
    if (S.signedOn) { if (S.selected && !S.profiles.has(S.selected)) S.selected = mine() ? key() : null; }
    renderAll();
    if (S.editing) fillTop();
  }, () => { S.slow = true; renderSignon(); renderNote(); });
  db.collection('messages').orderBy('ts', 'desc').limit(150).onSnapshot(snap => {
    const prevIds = new Set(S.msgs.map(m => m.id));
    S.msgs = snap.docs.map(d => { const x = d.data() || {}; return { id: d.id, uid: clamp(x.uid, 80), text: clamp(x.text, 300), kind: x.kind === 'me' ? 'me' : 'msg', ts: +x.ts || 0 }; }).filter(m => m.text).reverse();
    if (S.signedOn) {
      const fresh = S.msgs.filter(m => !prevIds.has(m.id) && m.uid !== key() && m.ts > S.t0 - 2000);
      if (fresh.length && prevIds.size >= 0) { sfx('in'); if (S.tab !== 'chat' && isPhone()) { S.unread += fresh.length; renderTabs(); } }
    }
    renderLog();
  }, () => {});
  renderAll();
}
async function initRoom() {
  if (S.roomInit) return; S.roomInit = true;
  const room = await use('room'); if (!room) return;
  S.room = room;
  room.presence({ uid: S.id || null }).catch(() => {});
  room.onPeers(ch => {
    const now = new Set();
    ch.peers.forEach(p => { if (p.kind !== 'viewer') return; const u = p.by || (p.presence && p.presence.uid); if (typeof u === 'string') now.add(u); });
    if (S.peersSettled) {
      for (const u of now) if (!S.online.has(u) && u !== key()) { const p = profileOf(u); sfx('open'); S.sys.push({ ts: Date.now(), text: (p ? p.sn : 'Someone') + ' has signed on.' }); }
      for (const u of S.online) if (!now.has(u) && u !== key()) { const p = profileOf(u); sfx('close'); S.sys.push({ ts: Date.now(), text: (p ? p.sn : 'Someone') + ' has signed off.' }); }
      if (S.sys.length > 40) S.sys.splice(0, S.sys.length - 40);
    }
    S.online = now;
    if (!S.roomLive) { S.roomLive = true; setTimeout(() => { S.peersSettled = true; }, 2500); }
    renderBuddies(); renderLog(); renderProfile();
  }, () => { S.roomLive = false; S.online = new Set(); renderBuddies(); renderLog(); });
}

/* ---------- Spotify now playing ---------- */
let mcp = null, spStop = null;
const SP = { server: 'Spotify', tool: 'get_currently_playing' };
const spSay = t => { $('spStat').textContent = t; };
function renderSp() {
  $('spRow').hidden = !(S.mcpOk && mine() && !S.readOnly);
  $('spBtn').textContent = S.spOn ? 'Spotify sync: on' : 'Sync from Spotify';
  $('spBtn').setAttribute('aria-pressed', S.spOn ? 'true' : 'false');
}
function playingFrom(res) {
  let p = res && res.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch { return null; } }
  const e = p && typeof p === 'object' ? p.currently_playing_entity : null;
  if (!e || typeof e !== 'object' || !e.name) return null;
  const artists = Array.isArray(e.creators) ? e.creators.map(c => c && c.name).filter(Boolean).join(', ') : '';
  let url = '';
  const su = safeUrl(e.url || '');
  if (su) { const u = new URL(su); url = u.origin + u.pathname; }
  return { title: clamp((artists ? artists + ' - ' : '') + String(e.name), 60), url: clamp(url, 300) };
}
async function applySong(np) {
  const p = mine();
  if (!np || !p || S.editing || S.readOnly || S.spBusy) return;
  if (p.song.title === np.title && p.song.url === np.url && p.song.auto) return;
  S.spBusy = true;
  const song = { title: np.title, url: np.url, auto: true };
  try { await persist(Object.assign({}, p, { song }), { song }); } finally { S.spBusy = false; }
  renderBuddies(); renderProfile();
}
function spGot(res) {
  const np = playingFrom(res);
  if (np) { spSay('♪ ' + np.title); applySong(np); } else spSay('Nothing playing on Spotify right now.');
}
function spOff(msg) {
  if (spStop) { spStop(); spStop = null; }
  S.spOn = false; LS.set('am.spotify', 'off'); renderSp(); spSay(msg || '');
}
function spFail(e) {
  const c = e && e.code;
  if (c === 'approval_required' || c === 'not_in_manifest' || c === 'consent_required') return spOff('Spotify was not allowed for this page. Tap Sync to try again.');
  if (c === 'server_not_connected' || c === 'selection_required' || c === 'server_not_found') return spOff('Spotify is not connected. Add it in claude.ai under Settings, then Connectors.');
  if (c === 'needs_reauth') return spOff('Reconnect Spotify in claude.ai under Settings, then Connectors.');
  if (c === 'blocked_by_policy') return spOff('Your organization blocks Spotify here.');
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return spOff('Spotify sync is not available in this view.');
  spSay(c === 'tool_error' ? 'Spotify returned an error. Is something playing?' : 'Spotify is not answering. It will try again.');
}
async function spStart(fromClick) {
  if (!mcp || spStop) return;
  if (fromClick) {
    spSay('Asking Spotify...');
    try { spGot(await mcp.callTool(SP.server, SP.tool, {}, { cache: false })); } catch (e) { spFail(e); return; }
  }
  S.spOn = true; LS.set('am.spotify', 'on'); renderSp();
  spStop = mcp.watchTool(SP.server, SP.tool, null, ev => { if (ev.type === 'data') spGot(ev.result); else spFail(ev.error); },
    { refetchInterval: 30000, cache: { staleTime: 20000, gcTime: 120000 } });
}
$('spBtn').addEventListener('click', () => { if (S.spOn) spOff(''); else spStart(true); });

/* ---------- wiring ---------- */
$('soForm').addEventListener('submit', signOn);
$('compose').addEventListener('submit', e => { e.preventDefault(); const i = $('msg'); const v = i.value; i.value = ''; send(v); i.focus(); });
$('stSel').addEventListener('change', setAway);
$('awayIn').addEventListener('change', setAway);
$('editBtn').addEventListener('click', openEditor);
$('offBtn').addEventListener('click', signOff);
$('sndBtn').addEventListener('click', () => { S.sound = !S.sound; LS.set('am.sound', S.sound ? 'on' : 'off'); renderMe(); if (S.sound) sfx('in'); });
$('eClose').addEventListener('click', closeEditor);
$('eCancel').addEventListener('click', closeEditor);
$('editForm').addEventListener('submit', saveEditor);
$('editForm').addEventListener('input', e => {
  if (e.target.type === 'file' || e.target.type === 'checkbox') return;
  if ((e.target.id === 'eSongT' || e.target.id === 'eSongU') && S.draft) S.draft.song.auto = false;
  livePreview();
});
$('editForm').addEventListener('change', e => { if (e.target.id === 'eAv') pickAvatar(e.target.files[0]); });
$('eAvRm').addEventListener('click', () => { S.draft.avatar = ''; $('eAv').value = ''; $('eAvPrev').replaceChildren(avatar(S.draft, 44)); renderProfile(); });
$('ePre').addEventListener('click', e => {
  const b = e.target.closest('[data-preset]'); if (!b) return;
  const p = PRESETS[b.dataset.preset];
  Object.assign(S.draft.theme, { preset: b.dataset.preset, ac: p.ac, bg: p.bg, fg: p.fg, font: p.font, pat: p.pat });
  syncLook(); applyViewer(S.draft.theme); renderProfile();
});
$('eTop').addEventListener('change', e => {
  const c = e.target; if (!c.matches || !c.matches('input[type=checkbox]')) return;
  const id = c.dataset.uid, d = S.draft;
  if (c.checked) { if (d.top.length < 8 && !d.top.includes(id)) d.top.push(id); } else d.top = d.top.filter(x => x !== id);
  fillTop(); renderProfile();
});
document.querySelectorAll('#tabs [data-go]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.go)));

buildEditorStatic();
document.body.dataset.tab = 'chat';
renderAll();
init();
})();
</script>
